<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description"
content="Tokyra metrics dashboard showing compression ratio, fidelity, CFS scores, and live API performance.">
<meta name="theme-color" content="#0D0D1A">
<link rel="icon" href="tokyra.png">
<title>Tokyra — Metrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="auth.js" defer></script>
<style>
:root{
--ink:#0D0D1A;
--ink-2:#1A1A2A;
--ink-3:#2A2A3A;
--hair:#3D3D4D;
--paper:#F0F0FF;
--paper-dim:#C0C0D0;
--muted:#9090A0;
--redline:#A050F0;
--redline-2:#8030D0;
--amber:#40A0F0;
--display:'Big Shoulders Display',sans-serif;
--body:'Inter',sans-serif;
--mono:'IBM Plex Mono',monospace;
--max:1120px;
--radius:18px;
}
*{
margin:0;
padding:0;
box-sizing:border-box;
}
html{
scroll-behavior:smooth;
}
body{
font-family:var(--body);
background:var(--ink);
color:var(--paper);
-webkit-font-smoothing:antialiased;
}
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(
circle at 18% 0%,
rgba(160, 80, 240, 0.07),
transparent 40%
),
radial-gradient(
circle at 100% 20%,
rgba(64, 160, 240, 0.05),
transparent 45%
);
pointer-events:none;
z-index:0;
}
a{
color:inherit;
}
.wrap{
max-width:var(--max);
margin:auto;
padding:0 6vw;
position:relative;
z-index:1;
}
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:28px 6vw;
max-width:var(--max);
margin:auto;
position:relative;
z-index:2;
}
.logo{
font-family:var(--display);
font-size:28px;
font-weight:900;
}
.logo span{
color:var(--redline);
}
.nav-right{
display:flex;
align-items:center;
gap:14px;
}
.btn{
display:inline-flex;
align-items:center;
justify-content:center;
padding:12px 22px;
border-radius:999px;
font-size:14px;
font-weight:600;
text-decoration:none;
cursor:pointer;
border:1px solid transparent;
transition:.2s;
}
.btn:hover{
transform:translateY(-2px);
}
.btn-outline{
border-color:var(--hair);
background:transparent;
color:var(--paper);
}
.btn-outline:hover{
border-color:var(--paper-dim);
}
.btn-primary{
background:var(--paper);
color:#0D0D1A;
}
.btn-redline{
background:var(--redline);
color:white;
}
.badge-soft{
font-family:var(--mono);
font-size:12px;
color:var(--muted);
border:1px solid var(--hair);
padding:8px 14px;
border-radius:999px;
}
.auth-controls{
display:flex;
gap:10px;
align-items:center;
}
.btn-sm{
padding:9px 16px;
font-size:13px;
}
.account-badge{
display:none;
font-family:var(--mono);
font-size:12px;
border:1px solid var(--hair);
padding:8px 14px;
border-radius:999px;
}
/* ---------- HERO ---------- */
.hero{
padding:70px 0 40px;
text-align:center;
}
.eyebrow{
display:inline-flex;
align-items:center;
gap:8px;
font-family:var(--mono);
font-size:12px;
letter-spacing:.08em;
text-transform:uppercase;
color:var(--muted);
border:1px solid var(--hair);
padding:8px 14px;
border-radius:999px;
margin-bottom:24px;
}
.eyebrow .dot{
width:7px;
height:7px;
border-radius:50%;
background:var(--redline);
}
h1{
font-family:var(--display);
font-size:clamp(45px,7vw,80px);
font-weight:900;
line-height:1;
margin-bottom:18px;
}
.hero .lede{
max-width:650px;
margin:auto;
color:var(--paper-dim);
font-size:18px;
line-height:1.7;
}
/* ---------- SECTIONS ---------- */
section.block{
padding:75px 0;
border-top:1px solid var(--hair);
}
.block-head{
max-width:700px;
margin-bottom:45px;
}
.block-eyebrow{
font-family:var(--mono);
font-size:12px;
letter-spacing:.1em;
text-transform:uppercase;
color:var(--redline);
display:block;
margin-bottom:15px;
}
.block-head h2{
font-family:var(--display);
font-weight:800;
font-size:clamp(30px,4vw,45px);
line-height:1.1;
}
.block-head p{
margin-top:15px;
color:var(--muted);
font-size:16px;
line-height:1.7;
}
/* ---------- METHODOLOGY ---------- */
.method-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px;
}
.method-card{
background:var(--ink-2);
border:1px solid var(--hair);
border-radius:var(--radius);
padding:30px;
}
.method-card .tag{
font-family:var(--mono);
font-size:12px;
color:var(--redline);
margin-bottom:15px;
}
.method-card h3{
font-family:var(--display);
font-size:28px;
margin-bottom:12px;
}
.method-card p{
font-size:14px;
line-height:1.7;
color:var(--muted);
}
.method-card code{
font-family:var(--mono);
background:var(--ink-3);
padding:3px 6px;
border-radius:5px;
color:var(--paper-dim);
font-size:12px;
}
/* ---------- LIVE STATUS ---------- */
.live-status{
display:flex;
align-items:center;
gap:10px;
font-family:var(--mono);
font-size:12px;
color:var(--muted);
margin-bottom:25px;
}
.live-dot{
width:8px;
height:8px;
background:var(--amber);
border-radius:50%;
}
.live-dot.err{
background:var(--redline);
}
/* ---------- STAT CARDS ---------- */
.stat-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}
.stat-card{
background:var(--ink-2);
border:1px solid var(--hair);
border-radius:14px;
padding:28px;
text-align:center;
}
.stat-card h4{
font-family:var(--mono);
font-size:11px;
letter-spacing:.08em;
text-transform:uppercase;
color:var(--muted);
margin-bottom:12px;
}
.stat-card .val{
font-family:var(--mono);
font-size:34px;
font-weight:600;
color:var(--paper-dim);
}
.stat-card.hl .val{
color:var(--amber);
}
.empty-note{
background:var(--ink-2);
border:1px dashed var(--hair);
border-radius:14px;
padding:28px;
text-align:center;
color:var(--muted);
line-height:1.7;
}
/* ---------- LATEST COMPRESSION ---------- */
.latest-card{
background:var(--ink-2);
border:1px solid var(--hair);
border-radius:var(--radius);
padding:30px;
}
.latest-title{
font-family:var(--mono);
color:var(--redline);
font-size:12px;
letter-spacing:.1em;
text-transform:uppercase;
margin-bottom:25p

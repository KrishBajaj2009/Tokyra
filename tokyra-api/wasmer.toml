[package]
name = "YOUR_WASMER_USERNAME/tokyra-api"
version = "0.1.0"
description = "Prompt Compressor backend (JS service worker, calls the Anthropic API)"
# See more keys and definitions at https://docs.wasmer.io/registry/manifest

[dependencies]
"wasmer/winterjs" = "*"

[fs]
"/app" = "./app"

[[command]]
name = "script"
module = "wasmer/winterjs:winterjs"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["serve", "/app/app.js", "--script"]

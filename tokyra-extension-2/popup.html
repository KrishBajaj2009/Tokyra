<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tokyra</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brandmark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M7.8 12h8.4M10.3 17h3.4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
      <div class="brandcopy"><strong>Tokyra</strong><span>Prompt optimizer</span></div>
      <button class="icon-button" id="settingsButton" type="button" aria-label="Open settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" stroke="currentColor" stroke-width="1.8"/><path d="m19.4 15 .1.1a2 2 0 0 1-2.8 2.8l-.1-.1a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8v.3a2 2 0 0 1-4 0v-.2A2 2 0 0 0 8 17.4a2 2 0 0 0-2.2.4l-.1.1a2 2 0 0 1-2.8-2.8L3 15a2 2 0 0 0 .4-2.2A2 2 0 0 0 1.6 12h-.2a2 2 0 0 1 0-4h.2a2 2 0 0 0 1.8-1.2A2 2 0 0 0 3 4.6l-.1-.1a2 2 0 0 1 2.8-2.8l.1.1A2 2 0 0 0 8 2.2 2 2 0 0 0 9.2.4V.2a2 2 0 0 1 4 0v.2a2 2 0 0 0 1.2 1.8 2 2 0 0 0 2.2-.4l.1-.1a2 2 0 0 1 2.8 2.8l-.1.1a2 2 0 0 0-.4 2.2A2 2 0 0 0 20.8 8h.2a2 2 0 0 1 0 4h-.2a2 2 0 0 0-1.8 1.2 2 2 0 0 0 .4 1.8Z" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/></svg>
      </button>
    </header>

    <section class="workspace">
      <div class="section-title">
        <div><span class="eyebrow">Your prompt</span><span id="inputCount">0 characters</span></div>
        <button class="text-button" id="pasteButton" type="button">Paste</button>
      </div>
      <textarea id="promptInput" maxlength="500000" placeholder="Paste a long prompt, instruction set, or policy…" spellcheck="true"></textarea>

      <div class="controls">
        <label><span>Style</span><select id="modeSelect"><option value="auto">Automatic</option><option value="safe">Safe</option><option value="balanced">Balanced</option><option value="maximum">Maximum</option></select></label>
        <label><span>Reduction</span><select id="targetSelect"><option value="20">Light · 20%</option><option value="35">Standard · 35%</option><option value="55">Strong · 55%</option><option value="75">Maximum · 75%</option></select></label>
      </div>

      <button class="primary" id="optimizeButton" type="button"><svg viewBox="0 0 24 24" fill="none"><path d="m13 3-1.2 5.1a2 2 0 0 1-1.5 1.5L5 11l5.3 1.4a2 2 0 0 1 1.5 1.5L13 19l1.2-5.1a2 2 0 0 1 1.5-1.5L21 11l-5.3-1.4a2 2 0 0 1-1.5-1.5L13 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Optimize prompt</span></button>
      <div class="error hidden" id="errorPanel" role="alert"></div>
    </section>

    <section class="result hidden" id="resultPanel">
      <div class="result-heading"><div><span class="success-dot"></span><strong id="resultTitle">Suggestion ready</strong></div><span id="latencyLabel"></span></div>
      <div class="metrics">
        <article><strong id="savedMetric">—</strong><span>tokens saved</span></article>
        <article><strong id="compressionMetric">—</strong><span>shorter</span></article>
        <article><strong id="fidelityMetric">—</strong><span>fidelity</span></article>
      </div>
      <div class="output-wrap"><pre id="outputText"></pre><button class="copy-button" id="copyButton" type="button">Copy</button></div>
      <p class="warning hidden" id="warningText"></p>
    </section>

    <footer><span><i></i>Worker connected</span><button id="siteToggle" type="button">Pause on this site</button></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>

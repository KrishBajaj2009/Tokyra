<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" rx="224" fill="#050505"/>

  <defs>
    <linearGradient id="gold" x1="180" y1="140" x2="844" y2="884" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7E2A0"/>
      <stop offset="0.25" stop-color="#D7B15A"/>
      <stop offset="0.55" stop-color="#B8872B"/>
      <stop offset="0.8" stop-color="#E8C973"/>
      <stop offset="1" stop-color="#8C6118"/>
    </linearGradient>
    <filter id="softGlow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">

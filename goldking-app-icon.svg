  </g>

  <line x1="218" y1="512" x2="376" y2="512" stroke="url(#gold)" stroke-width="10"/>
  <line x1="648" y1="512" x2="806" y2="512" stroke="url(#gold)" stroke-width="10"/>

  <rect x="224" y="468" width="112" height="88" rx="10" stroke="url(#gold)" stroke-width="6"/>
  <rect x="688" y="468" width="112" height="88" rx="10" stroke="url(#gold)" stroke-width="6"/>

  <text x="280" y="522" text-anchor="middle" fill="url(#gold)" font-size="40" font-family="Georgia, Times New Roman, serif" font-weight="700" letter-spacing="1.5">EST.</text>
  <text x="744" y="522" text-anchor="middle" fill="url(#gold)" font-size="38" font-family="Georgia, Times New Roman, serif" font-weight="700" letter-spacing="1.5">1990</text>

  <circle cx="512" cy="512" r="174" stroke="url(#gold)" stroke-width="10"/>

  <g transform="translate(512 346)">
    <polygon points="0,-32 34,-6 20,28 -20,28 -34,-6" stroke="url(#gold)" stroke-width="8" fill="none"/>
    <line x1="-20" y1="28" x2="20" y2="28" stroke="url(#gold)" stroke-width="6"/>
    <line x1="-10" y1="-12" x2="0" y2="28" stroke="url(#gold)" stroke-width="5"/>
    <line x1="10" y1="-12" x2="0" y2="28" stroke="url(#gold)" stroke-width="5"/>
    <line x1="-17" y1="-2" x2="17" y2="-2" stroke="url(#gold)" stroke-width="5"/>

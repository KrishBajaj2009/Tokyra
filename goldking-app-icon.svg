    </filter>
    <path id="topArc" d="M 220 512 A 292 292 0 0 1 804 512"/>
    <path id="bottomArc" d="M 804 512 A 292 292 0 0 1 220 512"/>
  </defs>

  <circle cx="512" cy="512" r="348" stroke="url(#gold)" stroke-width="14"/>
  <circle cx="512" cy="512" r="314" stroke="url(#gold)" stroke-width="4"/>

  <g opacity="0.18" filter="url(#softGlow)">
